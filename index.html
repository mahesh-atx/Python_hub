<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A practical, structured Python path: 13 topics, hundreds of questions, and 80+ projects for writing code from a blank file." />
    <meta name="theme-color" content="#e85d3f" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Python Practice Path — Stop watching. Start writing." />
    <meta property="og:description" content="A practical, no-shortcuts Python path for turning tutorials into code you can write from a blank file." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e85d3f'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='monospace' font-size='13' font-weight='bold' fill='white'%3E/%3E%3C/text%3E%3C/svg%3E" />
    <title>Python Practice Path — Stop watching. Start writing.</title>
    <style>html{visibility:hidden;opacity:0}html.ready{visibility:visible;opacity:1;transition:opacity .14s ease}html.ready body{background:#f8f6f1;color:#1d1c1a}html.ready[data-theme="dark"] body{background:#171716;color:#f4f0e9}#app{min-height:100vh}</style>
    <script>
      try {
        var saved = localStorage.getItem('python-practice-theme');
        var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch (e) {}
    </script>
    <link rel="modulepreload" href="/src/main.js" />
  </head>
  <body data-page="home" data-root-prefix="./">
    <div id="app">
      <main class="launch-fallback">
        <h1>Python Practice Path</h1>
        <p>Loading the interactive learning path…</p>
        <p>If nothing appears, make sure JavaScript is enabled, then run <code>npm run dev</code> and open the local address shown in the terminal.</p>
        <noscript><p>This learning path needs JavaScript to render its interactive sections.</p></noscript>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
    <noscript><style>html{visibility:visible;opacity:1}#app{opacity:1}</style></noscript>
  </body>
</html>
